apiVersion: neo4j.headyj.io/v1alpha1
kind: User
metadata:
  name: jni
spec:
  forProvider:
    passwordSecretRef:
      namespace: crossplane-system
      name: jni-password
      key: password
    roleRefs:
      - name: jni
  providerConfigRef:
    name: default
---
apiVersion: v1
kind: Secret
metadata:
  name: jni-password
  namespace: crossplane-system
type: Opaque
stringData:
  password: password1